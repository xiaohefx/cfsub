# CFSub —— Cloudflare 订阅管理面板
# 部署前请先执行：npx wrangler kv namespace create CF_SUB_KV
# 然后把生成的 id 填到下面的 id 字段

name = "cfsub"
main = "dist/_worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# KV 命名空间（面板配置、流量统计、日志都存这里）
[[kv_namespaces]]
binding = "CF_SUB_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# 自动更新定时任务（每 6 小时检查一次 GitHub 版本）
[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = false

# 可选：环境变量（优先级高于面板配置，会「锁定」对应字段）
# 详见 README「可配置变量」一节
# [vars]
# UUID = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
# MASTER_KEY = "你的管理密钥"
# PORTS = "443,2053,8443"
# NAME_PREFIX = "CFSub"
