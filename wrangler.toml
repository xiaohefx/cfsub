# CFSub —— Cloudflare 订阅管理面板
#
# 存储二选一（都绑定时优先用 D1）：
#   A. D1（推荐）：npx wrangler d1 create cfsub-db   → 填 database_id，绑定名 IOT_DB
#   B. KV        ：npx wrangler kv namespace create CF_SUB_KV → 填 id，绑定名 CF_SUB_KV

name = "cfsub"
main = "dist/_worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ---- 方式 A：D1 数据库（推荐，写配额高，适合流量统计）----
# [[d1_databases]]
# binding = "IOT_DB"
# database_name = "cfsub-db"
# database_id = "YOUR_D1_DATABASE_ID_HERE"

# ---- 方式 B：KV 命名空间 ----
[[kv_namespaces]]
binding = "CF_SUB_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# 自动更新定时任务（每 6 小时检查一次 GitHub 版本）
[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = false

# 可选：环境变量（优先级高于面板配置，会「锁定」对应字段）
# 详见 README「可配置变量」一节
# [vars]
# UUID = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
# MASTER_KEY = "你的管理密钥"
# PORTS = "443,2053,8443"
# NAME_PREFIX = "CFSub"
